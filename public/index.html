<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d2e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#08130f" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="منصة تعليمية للمناهج الشرعية: قرآن وفقه وعقيدة وسيرة وأخلاق، مقسّمة على السنوات والأعمار، ٣٠٠ ساعة لكل سنة." />
  <title>منهاج — منصة المناهج الشرعية</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <a class="skip-link" href="#main">تجاوز إلى المحتوى</a>

  <header class="app-bar">
    <button class="icon-btn menu-btn" type="button" data-nav-toggle aria-label="القائمة">☰</button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">﷽</span>
      <span class="brand-text">
        <strong>منهاج</strong>
        <small>مناهج شرعية بالسنوات والأعمار</small>
      </span>
    </a>
    <div class="app-bar-actions">
      <button class="icon-btn" type="button" data-search-open aria-label="بحث">🔍</button>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="تغيير المظهر">◐</button>
      <div class="user-chip" data-user-chip hidden></div>
    </div>
  </header>

  <div class="layout">
    <nav class="side-nav" data-side-nav aria-label="التنقّل الرئيسي"></nav>
    <main id="main" class="content" data-view tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" data-bottom-nav aria-label="تنقّل سريع"></nav>

  <div class="scrim" data-scrim hidden></div>
  <div class="toasts" data-toasts aria-live="polite"></div>
  <dialog class="sheet" data-search-dialog>
    <form class="search-form" data-search-form>
      <input type="search" name="q" placeholder="ابحث في الحصص والمرفقات…" autocomplete="off" />
      <button class="btn" type="submit">بحث</button>
      <button class="btn ghost" type="button" data-close-dialog>إغلاق</button>
    </form>
    <div class="search-results" data-search-results></div>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
